server {
    listen 80;
    server_name localhost;

    # 增加客户端请求体大小限制
    client_max_body_size 20M;

    # vuln-0007: 显式声明归一化前置,以免被上游配置覆盖。
    merge_slashes on;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api:5050/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;

        # SSE/流式响应支持
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 增加超时时间（上传和流式响应）
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }

    location /minio/public/ {
        limit_except GET HEAD {
            deny all;
        }
        # vuln-0007 链路放大器: 阻止外网经反代对 MinIO 完成 AWS SigV4 签名调用。
        # proxy_pass_request_headers off 直接剥离全部客户端头,使"借道访问 S3 API"
        # 在架构上不成立;下方显式声明 Host / Connection 仍是后端握手必需。
        proxy_pass_request_headers off;
        proxy_pass http://minio:9000/public/;
        proxy_set_header Host minio:9000;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }

    location /minio/ {
        return 404;
    }

    # vuln-0007: 阻断任何含编码点 / 编码斜杠 / 双重编码的原始 URI。
    # nginx 在 location 匹配前就会折叠 .. 点段,所以裸点段无需在此拦截
    # (会由 /minio/ { return 404 } 兜底);这里只拦截 nginx 不会自动解码的
    # 编码形式。注意:不要拦截裸 `..`,否则会误判合法键 `abc..def` / `v2..1..json`。
    location ~* ^/minio/public/.*(%2[eE]|%2[fF]|%5[cC]|%252[eE]|%252[fF]) {
        return 404;
    }
}
