<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">单个知识文件同步时序</title>
  <desc id="desc">第三方程序依次调用上传、处理任务、任务查询和检索验证接口。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#596675"/></marker>
    <style>.actor{fill:#e8f4ff;stroke:#1677c8;stroke-width:2;rx:10}.life{stroke:#a8b2bd;stroke-width:2;stroke-dasharray:6 6}.call{stroke:#596675;stroke-width:2;marker-end:url(#arrow)}.return{stroke:#23894e;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}.text{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1e2937;text-anchor:middle}.label{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#273444;text-anchor:middle}.note{fill:#fff4dd;stroke:#b87912;rx:8}</style>
  </defs>
  <rect width="1280" height="560" fill="#fff"/>
  <text x="40" y="38" style="font:700 24px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#17324d">单文件同步时序</text>
  <rect class="actor" x="70" y="62" width="190" height="54"/><text class="text" x="165" y="95">第三方同步程序</text>
  <rect class="actor" x="375" y="62" width="190" height="54"/><text class="text" x="470" y="95">超级楚楚 API</text>
  <rect class="actor" x="680" y="62" width="190" height="54"/><text class="text" x="775" y="95">对象存储</text>
  <rect class="actor" x="985" y="62" width="190" height="54"/><text class="text" x="1080" y="95">解析与向量入库</text>
  <path class="life" d="M165 116 V525"/><path class="life" d="M470 116 V525"/><path class="life" d="M775 116 V525"/><path class="life" d="M1080 116 V525"/>
  <path class="call" d="M165 155 H465"/><text class="label" x="315" y="145">POST /files/upload?kb_id=...</text>
  <path class="call" d="M470 190 H770"/><text class="label" x="620" y="180">保存原始文件</text>
  <path class="return" d="M775 225 H475"/><text class="label" x="625" y="215">MinIO URL</text>
  <path class="return" d="M470 260 H170"/><text class="label" x="320" y="250">file_path + content_hash + size</text>
  <path class="call" d="M165 305 H465"/><text class="label" x="315" y="295">POST /databases/{kb_id}/documents</text>
  <path class="call" d="M470 340 H1075"/><text class="label" x="775" y="330">添加记录 → 解析 → 分块 → Embedding</text>
  <path class="return" d="M470 375 H170"/><text class="label" x="320" y="365">task_id</text>
  <rect class="note" x="80" y="398" width="485" height="54"/><text class="text" x="322" y="430">循环：GET /api/tasks/{task_id}，直到任务终态</text>
  <path class="return" d="M1080 470 H475"/><text class="label" x="775" y="460">success + result.items[].file_id</text>
  <path class="return" d="M470 500 H170"/><text class="label" x="320" y="490">任务成功</text>
  <path class="call" d="M165 530 H465"/><text class="label" x="315" y="520">POST /databases/{kb_id}/query</text>
</svg>
